<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Esposa</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, #1a0033, #000);
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Contenedor del Corazón */
        .corazon-wrapper {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 250px; height: 250px;
            z-index: 10;
            animation: latido 1.2s infinite;
        }

        /* Foto con forma de corazón */
        .foto-corazon {
            width: 100%; height: 100%;
            object-fit: cover;
            /* Forma de corazón estándar */
            clip-path: url(#heart-path);
        }

        /* Brillo del corazón */
        .glow {
            position: absolute;
            width: 100%; height: 100%;
            background: #ff007f;
            filter: blur(30px);
            opacity: 0.5;
            z-index: -1;
            clip-path: url(#heart-path);
        }

        /* Elementos flotantes */
        .floating {
            position: absolute;
            color: #ffb6c1;
            font-weight: bold;
            text-shadow: 0 0 10px #ff007f;
            user-select: none;
            white-space: nowrap;
        }

        @keyframes latido {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            15% { transform: translate(-50%, -50%) scale(1.15); }
            30% { transform: translate(-50%, -50%) scale(1.05); }
        }

        #tap-msg {
            position: fixed; top: 20px; width: 100%;
            text-align: center; color: white; opacity: 0.6; z-index: 20;
        }
    </style>
</head>
<body onclick="start()" ontouchstart="start()">

    <div id="tap-msg">✨ Toca para iniciar la melodía ✨</div>

    <svg width="0" height="0">
        <defs>
            <clipPath id="heart-path" clipPathUnits="objectBoundingBox">
                <path d="M.5,0.2 C.4,0 0,0 0,0.35 C0,0.7 0.5,1 0.5,1 C0.5,1 1,0.7 1,0.35 C1,0 0.6,0 0.5,0.2"></path>
            </clipPath>
        </defs>
    </svg>

    <div class="corazon-wrapper">
        <div class="glow"></div>
        <img src="1000810278.jpg" class="foto-corazon">
    </div>

    <div id="cosmos"></div>

    <audio id="musica" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        let playing = false;
        function start() {
            if(!playing) {
                document.getElementById('musica').play();
                document.getElementById('tap-msg').style.display = 'none';
                playing = true;
            }
        }

        const words = ["Ti Amo", "🧸", "Mi Vida", "💖", "Bellissima", "🐻", "Sempre", "🌈"];
        const container = document.getElementById('cosmos');
        const elements = [];

        // Estrellas
        for(let i=0; i<100; i++) {
            const s = document.createElement('div');
            s.style.cssText = `position:absolute; width:2px; height:2px; background:white; top:${Math.random()*100}%; left:${Math.random()*100}%; border-radius:50%; opacity:${Math.random()}`;
            container.appendChild(s);
        }

        // Crear palabras y ositos
        words.forEach(txt => {
            const el = document.createElement('div');
            el.className = 'floating';
            el.innerText = txt;
            el.style.fontSize = txt.length > 2 ? '20px' : '45px';
            
            const data = {
                el: el,
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2
            };
            container.appendChild(el);
            elements.push(data);
        });

        function update() {
            elements.forEach(obj => {
                obj.x += obj.vx; obj.y += obj.vy;
                if(obj.x < 0 || obj.x > window.innerWidth - 50) obj.vx *= -1;
                if(obj.y < 0 || obj.y > window.innerHeight - 50) obj.vy *= -1;
                obj.el.style.left = obj.x + 'px';
                obj.el.style.top = obj.y + 'px';
            });
            requestAnimationFrame(update);
        }
        update();
    </script>
</body>
</html>
